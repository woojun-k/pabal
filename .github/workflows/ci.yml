name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test, and Migration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Show Gradle environment
        run: ./gradlew --version --no-daemon

      - name: Build, test, and validate Flyway migrations
        run: ./gradlew build --no-daemon --stacktrace
